# Mercy defaults of the build stage (php build.php create): after the product base and the project dev.yaml
# (the project build.yaml extends it), before the project build.yaml. So the image is always built for production,
# even if dev.yaml sets "local". Keep every key of dev.yaml here, otherwise dev values would leak into the image.
kernel:
  env: "production"
  dev_mode: false
